<svg xmlns="http://www.w3.org/2000/svg" width="320" height="44" viewBox="0 0 320 44" fill="none" stroke="#4A2E5A" stroke-width="0.7" aria-hidden="true">
  <!-- 5-line staff -->
  <line x1="0" y1="12" x2="320" y2="12"/>
  <line x1="0" y1="18" x2="320" y2="18"/>
  <line x1="0" y1="24" x2="320" y2="24"/>
  <line x1="0" y1="30" x2="320" y2="30"/>
  <line x1="0" y1="36" x2="320" y2="36"/>

  <!-- Treble clef silhouette -->
  <g transform="translate(10 0)" stroke-width="1">
    <path d="M14 6 C 4 14, 4 26, 14 34 C 22 40, 30 34, 26 26 C 22 20, 12 22, 12 30 C 12 40, 24 44, 28 32 M20 40 L20 10 C 20 4, 12 2, 10 8"/>
    <circle cx="20" cy="40" r="1.6" fill="#4A2E5A" stroke="none"/>
  </g>

  <!-- Time signature 4/4 -->
  <g transform="translate(46 14)" font-family="serif" font-size="12" fill="#4A2E5A" stroke="none">
    <text x="0" y="7" text-anchor="middle" font-weight="600">4</text>
    <text x="0" y="18" text-anchor="middle" font-weight="600">4</text>
  </g>

  <!-- Two beamed eighth notes -->
  <g stroke-width="0.9">
    <ellipse cx="78" cy="30" rx="4" ry="2.8" transform="rotate(-18 78 30)" fill="#4A2E5A" stroke="none"/>
    <ellipse cx="98" cy="24" rx="4" ry="2.8" transform="rotate(-18 98 24)" fill="#4A2E5A" stroke="none"/>
    <line x1="81" y1="28" x2="81" y2="8"/>
    <line x1="101" y1="22" x2="101" y2="6"/>
    <line x1="80" y1="8" x2="102" y2="6" stroke-width="2.4"/>
  </g>

  <!-- Quarter note -->
  <ellipse cx="128" cy="30" rx="4" ry="2.8" transform="rotate(-18 128 30)" fill="#4A2E5A" stroke="none"/>
  <line x1="131" y1="28" x2="131" y2="10" stroke-width="0.9"/>

  <!-- Half note (open head) -->
  <ellipse cx="156" cy="24" rx="4.2" ry="3" transform="rotate(-18 156 24)"/>
  <line x1="160" y1="22" x2="160" y2="4" stroke-width="0.9"/>

  <!-- Barline in the middle -->
  <line x1="180" y1="12" x2="180" y2="36" stroke-width="0.9"/>

  <!-- Two beamed sixteenths -->
  <g stroke-width="0.9">
    <ellipse cx="200" cy="28" rx="4" ry="2.8" transform="rotate(-18 200 28)" fill="#4A2E5A" stroke="none"/>
    <ellipse cx="218" cy="26" rx="4" ry="2.8" transform="rotate(-18 218 26)" fill="#4A2E5A" stroke="none"/>
    <line x1="203" y1="26" x2="203" y2="8"/>
    <line x1="221" y1="24" x2="221" y2="6"/>
    <line x1="202" y1="8" x2="222" y2="6" stroke-width="2.4"/>
    <line x1="202" y1="12" x2="222" y2="10" stroke-width="2.2" opacity="0.9"/>
  </g>

  <!-- Dotted quarter -->
  <ellipse cx="248" cy="24" rx="4" ry="2.8" transform="rotate(-18 248 24)" fill="#4A2E5A" stroke="none"/>
  <line x1="251" y1="22" x2="251" y2="4" stroke-width="0.9"/>
  <circle cx="256" cy="24" r="1.1" fill="#4A2E5A" stroke="none"/>

  <!-- Final double bar -->
  <line x1="278" y1="12" x2="278" y2="36" stroke-width="0.9"/>
  <line x1="283" y1="12" x2="283" y2="36" stroke-width="1.6"/>
</svg>
